properties
# --- Configuración de Memoria para Gradle y Kotlin ---
# Aumenta la memoria máxima para el proceso principal de Gradle.
# 4GB (4096m) es un valor seguro para la mayoría de proyectos modernos.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Habilita el caché de configuración para acelerar las compilaciones futuras.
org.gradle.caching=true

# Activa el Daemon de Gradle (ya suele estar activo, pero es bueno asegurarlo).
org.gradle.daemon=true

# --- Opcional pero recomendado: Memoria específica para el Daemon de Kotlin ---
# Esto le da al proceso de compilación de Kotlin su propio espacio de memoria.
kotlin.daemon.jvmargs=-Xmx2048m

# --- Propiedades de AndroidX ---
# Indica a los plugins que usen las librerías de AndroidX.
android.useAndroidX=true
# Migra automáticamente las dependencias de terceros para que usen AndroidX.
android.enableJetifier=true
